name: Lembrete pós-TCC — desligar Railway

on:
  schedule:
    # 19/05/2026 às 12:00 UTC = 09:00 BRT
    - cron: '0 12 19 5 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  abrir-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Criar issue de lembrete
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ⏰ Pós-defesa do TCC — desligar Railway',
              '',
              'A defesa do TCC ocorreu hoje (19/05/2026). Pra evitar cobrança continuada do Railway, faça o desligamento:',
              '',
              '- [ ] 1. Acessar https://railway.com → projeto `arvore-alerta`',
              '- [ ] 2. **Settings → Danger zone → Pause service** (mantém configs e volume; pode reativar depois) **ou** **Delete service** (irreversível)',
              '- [ ] 3. Confirmar offline: `curl https://arvore-alerta-production.up.railway.app/stats` deve falhar',
              '- [ ] 4. Frontend GitHub Pages continua de pé (gratuito) — mapa vai ficar vazio sem backend',
              '',
              '**Custo se esquecer:** ~US$5/mês de hobby plan + créditos consumidos pelo cron horário.',
              '',
              '_Issue gerada automaticamente pelo workflow `.github/workflows/lembrete-pos-tcc.yml`_'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⏰ Pós-TCC: desligar Railway (19/05)',
              body,
              labels: ['lembrete', 'devops']
            });
